[package]
name = "yama"
version = "0.1.0"

[workspace]
package.edition = "2021"
members = ["kernel"]
resolver = "2"

[build-dependencies]
bootloader = "0.11.9"
yama-kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none", package = "yama-kernel" }

[dependencies]
ovmf-prebuilt = "0.1.0-alpha.1"